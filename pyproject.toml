[project]
name = "job-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David", email = "david.huizinga@veneficus.nl" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1.0",
    "pydantic>=2.0",
    "pydantic-ai>=1.0",
    "pandas>=2.2.0",
    "geopy>=2.4.0",
    "pypdf>=5.0",
    "python-jobspy @ git+https://github.com/speedyapply/JobSpy.git",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.6",
    "streamlit>=1.40.0",
]

[project.scripts]
job-search = "job_search:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
